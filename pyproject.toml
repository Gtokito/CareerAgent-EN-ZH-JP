[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "career-agent-en-zh-jp"
version = "1.0.0"
description = "Automated Multilingual Career Alignment & Strategic Resume Pipeline Engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "python-docx>=0.8.11",
]

[project.urls]
Homepage = "https://github.com/Gtokito/CareerAgent-EN-ZH-JP"
Repository = "https://github.com/Gtokito/CareerAgent-EN-ZH-JP"
